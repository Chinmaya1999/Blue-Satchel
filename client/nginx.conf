# Internal Nginx config for the client container. Only serves static files
# — the host-level Nginx (deploy/nginx/site.conf) is what the internet
# actually talks to; it routes /api and /uploads to the server container
# and everything else here, so this config never needs to know about the
# API at all.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
