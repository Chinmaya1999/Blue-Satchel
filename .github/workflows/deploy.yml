name: Deploy

# Runs on every push to main. Assumes setup-server.yml has already been run
# once for this server — this workflow never installs system packages, it
# only ships new code: build both images here, then blue/green-swap them
# in together on the box with a health-check gate, so a broken build never
# takes the site down and client/server are always a matched pair.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image ref (GHCR requires lowercase)
        id: image
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}-server:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: server
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

  build-client-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image ref (GHCR requires lowercase)
        id: image
        run: |
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image=ghcr.io/${REPO_LC}-client:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: client
          push: true
          tags: ${{ steps.image.outputs.image }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    needs: [build-server-image, build-client-image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

      - name: Sync deploy scripts (in case they changed)
        run: |
          ssh -i /tmp/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p /opt/blue-satchel/deploy"
          rsync -az -e "ssh -i /tmp/deploy_key" deploy/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/opt/blue-satchel/deploy/"

      - name: Log in to GHCR on the server
        run: |
          ssh -i /tmp/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Deploy (blue/green swap, client + server together)
        run: |
          ssh -i /tmp/deploy_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash /opt/blue-satchel/deploy/deploy-app.sh ${{ needs.build-server-image.outputs.image }} ${{ needs.build-client-image.outputs.image }}"

      - name: Smoke test the live site
        run: |
          curl -sf "http://${{ secrets.EC2_HOST }}/api/health"
          curl -sf "http://${{ secrets.EC2_HOST }}/" > /dev/null

      - name: Clean up SSH key
        if: always()
        run: rm -f /tmp/deploy_key
