name: CI

# Fast feedback on every push/PR that isn't going to production yet.
# No deployment happens here — see deploy.yml for that.
on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install & build client
        working-directory: client
        run: |
          npm ci
          npm run build

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Syntax-check server source
        working-directory: server
        run: find src -name "*.js" -exec node --check {} \;

      - uses: docker/setup-buildx-action@v3

      - name: Build server Docker image (build-only, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: server
          push: false

      - name: Build client Docker image (build-only, not pushed)
        uses: docker/build-push-action@v5
        with:
          context: client
          push: false
