<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<style>
  html, body { margin: 0; height: 100vh; background: transparent; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
  canvas { position: absolute; left: 0; top: 0; display: block; }
  .callout { position: absolute; left: 0; top: 0; pointer-events: none; opacity: 0; will-change: transform, opacity; }
  .callout .tag {
    transform: translate(18px, -50%); white-space: nowrap;
    background: rgba(24, 14, 52, 0.62); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 10px;
    padding: 4px 8px; color: #fff; font: 600 11px/1.2 -apple-system, Roboto, sans-serif;
  }
  .callout .tag small { display: block; font: 600 8.5px/1.1 ui-monospace, Menlo, monospace; letter-spacing: 1.3px; color: #8fe9ff; margin-bottom: 2px; }
  .callout.left .tag { transform: translate(calc(-100% - 18px), -50%); }
  .hud {
    position: absolute; left: 10px; top: 10px; width: 118px; padding: 8px 10px; border-radius: 12px;
    background: rgba(24, 14, 52, 0.55); border: 1px solid rgba(255, 255, 255, 0.18); color: #fff;
    font: 10px/1.5 ui-monospace, Menlo, monospace; opacity: 0; transition: opacity 1s ease;
  }
  .hud.on { opacity: 1; }
  .hud .top { display: flex; justify-content: space-between; color: #8fe9ff; letter-spacing: 1.4px; font-size: 8.5px; }
  .hud .bar { height: 3px; border-radius: 2px; background: rgba(255,255,255,.14); margin: 5px 0 6px; overflow: hidden; }
  .hud .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #6fe7ff, #c784ea); animation: sweep 2.2s ease-in-out infinite; }
  .hud .row { display: flex; justify-content: space-between; color: rgba(255,255,255,.75); }
  .hud .row b { color: #fff; font-weight: 600; }
  @keyframes sweep { 0% { width: 8%; } 100% { width: 100%; } }
</style>
<script type="importmap">
{ "imports": { "three": "./three.module.min.js", "three/addons/": "./addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">
  <div class="top"><span>SCANNING</span><span>LIVE</span></div>
  <div class="bar"><i></i></div>
  <div class="row"><span>mesh.vertices</span><b id="verts">9,279</b></div>
  <div class="row"><span>zones</span><b>7 / 7</b></div>
  <div class="row"><span>lighting</span><b>OK</b></div>
</div>
<div id="callouts"></div>
<script type="module" src="./hero.js"></script>
</body>
</html>
