# DXB Beauty — host-level reverse proxy WITH HTTPS.
# Installed by setup-ec2.sh in place of site.conf once the Let's Encrypt
# certificate for dxbbeauty.com exists (issued by enable-https.sh). One
# certificate covers all three names: dxbbeauty.com, www.dxbbeauty.com,
# api.dxbbeauty.com.
# `blue_satchel_api` / `blue_satchel_client` come from active-upstream.conf.

# Plain HTTP: ACME challenges, then everything redirects to HTTPS.
server {
    listen 80;
    server_name dxbbeauty.com www.dxbbeauty.com api.dxbbeauty.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Raw-IP / unknown-host fallback on port 80 (keeps CI smoke tests working).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://blue_satchel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # AI skin analysis can take a few minutes (Rupam allows up to 210s).
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location /uploads/ {
        proxy_pass http://blue_satchel_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://blue_satchel_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# www -> canonical https://dxbbeauty.com
server {
    listen 443 ssl http2;
    server_name www.dxbbeauty.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/dxbbeauty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dxbbeauty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 301 https://dxbbeauty.com$request_uri;
}

# API / backend
server {
    listen 443 ssl http2;
    server_name api.dxbbeauty.com;
    server_tokens off;
    ssl_certificate     /etc/letsencrypt/live/dxbbeauty.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dxbbeauty.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 10m;

    location / {
        proxy_pass http://blue_satchel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # AI skin analysis can take a few minutes (Rupam allows up to 210s).
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}

