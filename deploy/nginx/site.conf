# DXB BEAUTY — host-level reverse proxy.
# Installed by setup-ec2.sh at /etc/nginx/conf.d/blue-satchel.conf. This is the
# HTTP-only config used until a certificate exists; once enable-https.sh has
# issued one, setup-ec2.sh installs site-ssl.conf instead.
# Both `blue_satchel_api` and `blue_satchel_client` are defined by whichever
# of upstream-blue.conf / upstream-green.conf is currently copied to
# /etc/nginx/conf.d/active-upstream.conf — client and server are deployed
# and swapped together as one versioned unit by deploy-app.sh, then this
# gets reloaded (a graceful reload — no dropped connections).

# Alias host -> canonical site. www.dxbbeauty.com
# redirects permanently to https://dxbbeauty.com.
server {
    listen 80;
    server_name www.dxbbeauty.com;
    server_tokens off;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://dxbbeauty.com$request_uri;
    }
}

# API / backend: https://api.dxbbeauty.com
server {
    listen 80;
    server_name api.dxbbeauty.com;
    server_tokens off;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://blue_satchel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # AI skin analysis can take a few minutes (Rupam allows up to 210s).
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }
}

# Client front end: https://dxbbeauty.com. `_` / default_server keeps the
# raw-IP health checks (and any unknown Host) landing here too.
server {
    listen 80 default_server;
    server_name dxbbeauty.com _;
    server_tokens off;

    client_max_body_size 10m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://blue_satchel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # AI skin analysis can take a few minutes (Rupam allows up to 210s).
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location /uploads/ {
        proxy_pass http://blue_satchel_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://blue_satchel_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
