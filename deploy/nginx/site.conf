# Blue Satchel — host-level reverse proxy.
# Installed once by setup-ec2.sh at /etc/nginx/conf.d/blue-satchel.conf.
# Both `blue_satchel_api` and `blue_satchel_client` are defined by whichever
# of upstream-blue.conf / upstream-green.conf is currently copied to
# /etc/nginx/conf.d/active-upstream.conf — client and server are deployed
# and swapped together as one versioned unit by deploy-app.sh, then this
# gets reloaded (a graceful reload — no dropped connections).

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    location /api/ {
        proxy_pass http://blue_satchel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location /uploads/ {
        proxy_pass http://blue_satchel_api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://blue_satchel_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
