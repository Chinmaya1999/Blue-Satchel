# Blue Satchel — host-level reverse proxy / static site config.
# Installed once by setup-ec2.sh at /etc/nginx/conf.d/blue-satchel.conf.
# The `blue_satchel_api` upstream it references is defined by whichever of
# upstream-blue.conf / upstream-green.conf is currently symlinked/copied to
# /etc/nginx/conf.d/active-upstream.conf — swapped atomically by
# deploy-server.sh on every deploy, then reloaded (no dropped connections).

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    root /opt/blue-satchel/client-current;
    index index.html;

    location /api/ {
        proxy_pass http://blue_satchel_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
    }

    location /uploads/ {
        proxy_pass http://blue_satchel_api;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
